name: daily screen

# Pre-market on purpose: every price in the screen is the prior session's close, so the
# run is reproducible and a name cannot show two different prices on one calendar day the
# way it did when this ran intraday.
#
# ONE cron, in UTC, deliberately. The previous version scheduled both possible UTC hours
# and used a guard step to drop whichever was not 07:23 Eastern that day. That bought
# nothing: the requirement is only that the run lands before the 09:30 ET open, not that
# it lands at a particular local hour, and the DST machinery cost two real failures. It
# skipped silently whenever a run started outside the 07:00 ET hour (this workflow has
# already been delayed 7h10m once, and a silent skip reporting success is the exact
# failure this project exists to prevent), and its 11:23/12:23 UTC slots ran AFTER the
# analyst routine that consumes this output, so the analyst read stale briefs.
#
# 10:23 UTC is 06:23 ET in summer and 05:23 ET in winter — comfortably pre-market in both
# — and leaves roughly an hour of margin ahead of the analyst. The minute is :23 rather
# than :00 or :30 because runs on the hour and half-hour sit in the most contended queue.
#
# Lateness is now survivable rather than fatal: prices.drop_incomplete_session discards a
# partial bar, so a delayed run still prices off the last completed session.
on:
  schedule:
    - cron: "23 10 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only screen the first N names (leave empty for the full universe)"
        required: false
      skip_news:
        description: "Skip the news pass (price signals only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Offline, sub-second, and guards every valuation bug that has actually shipped.
      # If the math is broken there is no point spending 20 minutes screening with it.
      - name: Regression tests
        run: python test_engine.py

      # Raw EDGAR payloads are disposable — data/fundamentals.json is the durable copy.
      # This cache only saves bandwidth on same-day reruns.
      - uses: actions/cache@v4
        with:
          path: cache
          key: edgar-${{ github.run_id }}
          restore-keys: edgar-

      - name: Screen, pull news, and pick today's ten
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret is not set. SEC returns 403 to anonymous"
            echo "::error::clients, so every fundamental would be missing. Set it under"
            echo "::error::Settings -> Secrets -> Actions as 'equity-engine <your-email>'."
            exit 1
          fi
          python run.py daily \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.skip_news == true && '--skip-news' || '' }}
          python run.py site

      - name: Fail loudly if the screen produced nothing
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/screen.json"))
          n = d["counts"].get("modelled", 0)
          total = len(d["rows"])
          print(f"modelled {n} / {total}")
          # A healthy full run models well over half the index. Anything near zero means
          # the data sources were unreachable, and a green run that silently produced no
          # research is exactly how the previous version of this project wasted 27 days.
          if total > 100 and n < total * 0.25:
              sys.exit(f"only {n}/{total} names modelled — data sources are probably blocked")
          if n == 0:
              sys.exit("no names modelled at all")
          PY

      # News is an enrichment, not a dependency: a throttled Yahoo must not fail the run.
      # But a silent total failure would leave selection blind, so say so in the log.
      - name: Report the news pass
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/news/summary.json")
          if not p.exists():
              print("::warning::no news summary written — selection ran on price signals only")
              raise SystemExit(0)
          s = json.load(p.open())
          print(f"news: {s.get('companies',0)} companies, "
                f"{len(s.get('sectors') or {})} sectors, "
                f"{s.get('macro',0)} macro, {s.get('articles_new',0)} new articles "
                f"in {s.get('elapsed_s',0)}s")
          if not s.get("sectors"):
              print("::warning::sector feeds returned nothing — Yahoo may be throttling")
          PY

      - name: Commit
        run: |
          git config user.name  "equity-engine[bot]"
          git config user.email "equity-engine[bot]@users.noreply.github.com"
          TICKERS=$(python -c "import json; print(', '.join(p['ticker'] for p in json.load(open('data/picks.json'))['picks']))")
          git add -A data briefs public
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "screen $(date -u +%F): $TICKERS"
            # Push must be loud. A silently failing push is exactly how the previous
            # version of this project reported 27 green runs while persisting nothing.
            git push || { echo "::error::git push FAILED — this run persisted nothing"; exit 2; }
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily screen"
            python run.py status
          } >> "$GITHUB_STEP_SUMMARY"
